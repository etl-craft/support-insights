# Pull requests that change the project: validate it with no secrets and no cluster.
name: Validate
on:
  pull_request:
    paths:
      - "project/**"
      - "ci/**"
      - ".github/workflows/validate.yml"
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: project validates against a local DuckDB warehouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Config plan, apply, bundle publish and validate on an empty Engine DB
        run: ci/validate.sh
