# Every pull request: validate the project with no secrets and no cluster. It has no path filter
# because the main ruleset requires this check, and a required check that does not run blocks the
# merge of a change outside project/.
name: Validate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: project validates against a local DuckDB warehouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Config plan, apply, bundle publish and validate on an empty Engine DB
        run: ci/validate.sh
