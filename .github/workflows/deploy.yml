# Project or deployment-workflow changes on main apply to the running deployment. The
# self-hosted support-insights runner uses the developer token after a required reviewer approves
# the production environment. An admin bootstraps alert routing separately. This workflow
# never runs on pull_request.
name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project/**"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: apply the project to the deployment
    runs-on: [self-hosted, support-insights]
    environment: production
    timeout-minutes: 60
    env:
      ETL_CRAFT_API: ${{ vars.ETL_CRAFT_API }}
      ETL_CRAFT_TOKEN: ${{ secrets.ETL_CRAFT_DEVELOPER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install the pinned etl-craft command line
        run: ci/install.sh "$RUNNER_TEMP/etl-craft"
      - name: Plan, deploy, validate, rebuild the catalog and run the reference pipeline
        run: |
          PATH="$RUNNER_TEMP/etl-craft/venv/bin:$PATH"
          cli="etl-craft --api $ETL_CRAFT_API --project support_insights --yes"
          $cli deploy --plan --project-dir project
          $cli deploy --project-dir project
          $cli validate
          $cli lineage --refresh
          $cli generate-docs --with-warehouse
          $cli run --pipeline-code SI_REFERENCE \
            --reason "GitHub deployment ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
