Secrets:
  Source_type: ENVIRONMENT
Orchestration:
  Project: support_insights
  Api_address: 0.0.0.0:8730
  Log_dir: /state/logs
  Email:
    Host: mailpit
    Port: 1025
    From_address: etl-craft@example.test
    Tls_mode: NONE
Deployment:
  Profile: CONTROLLER_AGENTS
Engine:
  dev:
    Jdbc_url: ENGINE_JDBC_URL
    Listen_jdbc_url: jdbc:postgresql://engine-rw:5432/etl_craft
    User: etl_craft
    Auth_mode: PASSWORD
    Secret: ENGINE_PASSWORD
    Schema: etl_craft
Warehouse:
  Name: Trino
  Table_format: ICEBERG
  dev:
    Jdbc_url: jdbc:trino://trino:8080/warehouse/aud_mirror
    Schema: aud_mirror
    User: etl_craft
    Auth_mode: NONE
Docs_site:
  Trusted_proxies:
  - 10.42.0.0/16
Object_stores:
  lake:
    Endpoint: http://minio-lake:9000
    Region: us-east-1
    Url_style: PATH
    Auth_mode: KEYS
    Access_key_id: LAKE_ACCESS_KEY
    Secret_access_key: LAKE_SECRET_KEY
Artifacts:
  Store: s3://bundles/support-insights
  Profile: lake
Logs:
  Store: s3://logs/support-insights
  Profile: lake
Retention:
  Run_history_days: 7
  Attempt_log_days: 2
  Consumption_days: 7
  Interventions_days: 30
  Config_history_days: 30
  Daily_at: 03:00
Privacy:
  Hmac_secret: PRIVACY_HMAC
