resources:
- engine.yml
- services.yml
- roles.yml
- agents.yml
- ingress.yml
images:
- name: etl-craft-project
  newName: support-insights-project
  newTag: 6e6ee0ee36eacb52a0a8ffd59af5c7faf4bf3121
- name: support-insights-generator
  newTag: 6e6ee0ee36eacb52a0a8ffd59af5c7faf4bf3121
patches:
- target:
    kind: Deployment
    name: etl-craft-ui
  patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts/1/subPath
      value: ui.yml
- target:
    kind: Deployment
    name: agent-ingestion-.*
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: support-insights-ingestion:6e6ee0ee36eacb52a0a8ffd59af5c7faf4bf3121
    - op: replace
      path: /spec/template/spec/containers/0/args
      value:
      - agent
      - --pool
      - ingestion
      - --python-slots
      - '1'
      - --warehouse-slots
      - '0'
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SSL_CERT_FILE
        value: /etc/ssl/certs/demo-ca.crt
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: ca
        mountPath: /etc/ssl/certs/demo-ca.crt
        subPath: ca.crt
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: ca
        configMap:
          name: demo-ca
- target:
    kind: Deployment
    name: agent-warehouse-.*
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/args
      value:
      - agent
      - --pool
      - warehouse
      - --python-slots
      - '0'
      - --warehouse-slots
      - '1'
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SSL_CERT_FILE
        value: /etc/ssl/certs/demo-ca.crt
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: ca
        mountPath: /etc/ssl/certs/demo-ca.crt
        subPath: ca.crt
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: ca
        configMap:
          name: demo-ca
- target:
    kind: Deployment
    name: etl-craft-(controller|ui)
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: provider
        mountPath: /secrets
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: provider
        secret:
          secretName: etl-craft-provider
          defaultMode: 288

- target:
    kind: Deployment
    name: etl-craft-(controller|ui)
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: upload-directories
        image: support-insights-project:6e6ee0ee36eacb52a0a8ffd59af5c7faf4bf3121
        command: ["/bin/sh", "-c", "mkdir -p /shared/uploads /shared/processed_uploads"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: project
          mountPath: /shared
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts/1/mountPath
      value: /project/artifacts/craft-connector.yml
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --config
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: /project/artifacts/craft-connector.yml

- target:
    kind: Deployment
    name: agent-.*
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: ETL_CRAFT_AGENT_INSTANCE_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
