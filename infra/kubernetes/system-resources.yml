apiVersion: v1
kind: LimitRange
metadata:
  name: memory-bounds
  namespace: kube-system
spec:
  limits:
    - type: Container
      default:
        memory: 128Mi
      defaultRequest:
        memory: 16Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: memory-bounds
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        memory: 16Mi
