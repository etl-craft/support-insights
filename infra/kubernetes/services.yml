apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-gamma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio-gamma
  template:
    metadata:
      labels:
        app: minio-gamma
    spec:
      containers:
      - name: minio-gamma
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: local-demo-only
        - name: MINIO_NOTIFY_WEBHOOK_ENABLE_GAMMA
          value: 'on'
        - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_GAMMA
          value: http://generator:1212/gamma/events
        - name: MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_GAMMA
          value: local-webhook-only
        - name: MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_GAMMA
          value: /data/.events
        args:
        - server
        - /data
        - --console-address
        - :9001
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-gamma
---
apiVersion: v1
kind: Service
metadata:
  name: minio-gamma
spec:
  selector:
    app: minio-gamma
  ports:
  - name: p9000
    port: 9000
    targetPort: 9000
  - name: p9001
    port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-gamma
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
