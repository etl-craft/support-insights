apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
      - name: iceberg-rest
        image: apache/iceberg-rest-fixture:1.10.1
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - containerPort: 8181
        env:
        - name: CATALOG_WAREHOUSE
          value: s3://warehouse/
        - name: CATALOG_URI
          value: jdbc:sqlite:/data/catalog.db?journal_mode=WAL&busy_timeout=30000&transaction_mode=IMMEDIATE
        - name: CATALOG_CLIENTS
          value: '1'
        - name: CATALOG_JDBC_USER
          value: user
        - name: CATALOG_JDBC_PASSWORD
          value: password
        - name: CATALOG_IO__IMPL
          value: org.apache.iceberg.aws.s3.S3FileIO
        - name: CATALOG_S3_ENDPOINT
          value: http://minio-lake:9000
        - name: CATALOG_S3_PATH__STYLE__ACCESS
          value: 'true'
        - name: AWS_ACCESS_KEY_ID
          value: minioadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: local-demo-only
        - name: AWS_REGION
          value: us-east-1
        - name: JAVA_TOOL_OPTIONS
          value: -Xms64m -Xmx256m
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: iceberg-rest
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
spec:
  selector:
    app: iceberg-rest
  ports:
  - name: p8181
    port: 8181
    targetPort: 8181
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-rest
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  config.properties: 'coordinator=true

    node-scheduler.include-coordinator=true

    http-server.http.port=8080

    discovery.uri=http://localhost:8080

    query.max-memory=768MB

    query.max-memory-per-node=768MB

    memory.heap-headroom-per-node=512MB

    '
  node.properties: 'node.environment=demo

    node.id=support-insights

    node.data-dir=/tmp/trino

    '
  jvm.config: '-server

    -Xmx2G

    -XX:+UseG1GC

    -XX:+ExitOnOutOfMemoryError

    '
  warehouse.properties: '# Trino''s Iceberg connector, reading the local REST catalog
    and storing data in MinIO.

    connector.name=iceberg

    iceberg.catalog.type=rest

    iceberg.rest-catalog.uri=http://iceberg-rest:8181

    iceberg.rest-catalog.warehouse=s3://warehouse/

    fs.s3.enabled=true

    s3.endpoint=http://minio-lake:9000

    s3.region=us-east-1

    s3.aws-access-key=minioadmin

    s3.aws-secret-key=local-demo-only

    # MinIO serves buckets as paths, not subdomains.

    s3.path-style-access=true


    iceberg.expire-snapshots.min-retention=1d

    iceberg.remove-orphan-files.min-retention=1d

    '
  access-control.properties: 'access-control.name=file

    security.config-file=/etc/trino/rules.json

    '
  rules.json: '{"catalogs": [{"user": "gamma_signal", "catalog": "warehouse", "allow":
    "all"}, {"user": ".*", "allow": "all"}], "schemas": [{"user": "gamma_signal",
    "catalog": "warehouse", "schema": "lnd", "owner": false}, {"user": "gamma_signal",
    "owner": false}, {"user": ".*", "owner": true}], "tables": [{"user": "gamma_signal",
    "catalog": "warehouse", "schema": "lnd", "table": "gamma_object_events", "privileges":
    ["INSERT"]}, {"user": "gamma_signal", "privileges": []}, {"user": ".*", "privileges":
    ["SELECT", "INSERT", "DELETE", "UPDATE", "OWNERSHIP", "GRANT_SELECT"]}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
      - name: trino
        image: trinodb/trino:483
        resources:
          requests:
            cpu: 20m
            memory: 2560Mi
          limits:
            cpu: '1'
            memory: 3Gi
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: trino-config
          mountPath: /etc/trino
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: trino-config
        configMap:
          name: trino-config
          items:
          - key: config.properties
            path: config.properties
          - key: node.properties
            path: node.properties
          - key: jvm.config
            path: jvm.config
          - key: warehouse.properties
            path: catalog/warehouse.properties
          - key: access-control.properties
            path: access-control.properties
          - key: rules.json
            path: rules.json
---
apiVersion: v1
kind: Service
metadata:
  name: trino
spec:
  selector:
    app: trino
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
---
