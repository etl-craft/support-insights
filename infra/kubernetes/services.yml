apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: generator
  template:
    metadata:
      labels:
        app: generator
    spec:
      containers:
      - name: generator
        image: support-insights-generator:6e6ee0ee36eacb52a0a8ffd59af5c7faf4bf3121
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - containerPort: 1212
        env:
        - name: ORCH_SCRIPT_DIRS
          value: /app/generators
        - name: ORCH_INPUT_MIN
          value: '100'
        - name: ORCH_INPUT_MAX
          value: '1000'
        - name: ORCH_DB_FILE
          value: /app/storage/orchestrator.db
        - name: SQLITE_DB_FILE
          value: /app/storage/generator.db
        - name: ORCH_NEXT_DELAY_MIN
          value: '300'
        - name: ORCH_NEXT_DELAY_MAX
          value: '600'
        - name: CHUNK_SIZE
          value: '100'
        - name: MONGO_HOST
          value: mongodb
        - name: MONGO_PORT
          value: '27017'
        - name: MONGO_DB
          value: support_insights
        - name: MONGO_COLLECTION
          value: support
        - name: MONGO_USER
          value: generator
        - name: MONGO_PASSWORD
          value: local-mongo-only
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: KAFKA_CLIENT_BETA_STORAGE_TOPIC
          value: client-beta
        - name: MINIO_ENDPOINT
          value: http://minio-gamma:9000
        - name: MINIO_USER
          value: minioadmin
        - name: MINIO_PASSWORD
          value: local-demo-only
        - name: MINIO_CLIENT_GAMMA_STORAGE_BUCKET
          value: gamma
        - name: GAMMA_WEBHOOK_TOKEN
          value: local-webhook-only
        - name: MINIO_HOST
          value: minio-gamma
        - name: MINIO_PORT
          value: '9000'
        volumeMounts:
        - name: data
          mountPath: /app/storage
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: generator
      securityContext:
        fsGroup: 10001
---
