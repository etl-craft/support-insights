apiVersion: v1
kind: Pod
metadata:
  name: craft-admin
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
  - name: admin
    image: support-insights-project:10f4aa8c57d0a8085bb3a5ef1d79cded004d6137
    imagePullPolicy: Never
    command: [sh, -c, 'sleep 3600']
    envFrom:
    - secretRef:
        name: etl-craft-engine
    resources:
      requests: {cpu: 20m, memory: 128Mi}
      limits: {cpu: '1', memory: 768Mi}
    volumeMounts:
    - {name: config, mountPath: /project/craft-connector.yml, subPath: engine.yml}
    - {name: state, mountPath: /state}
    - {name: provider, mountPath: /secrets, readOnly: true}
  volumes:
  - name: config
    configMap: {name: etl-craft-config}
  - name: state
    emptyDir: {}
  - name: provider
    secret: {secretName: etl-craft-provider, defaultMode: 288}
